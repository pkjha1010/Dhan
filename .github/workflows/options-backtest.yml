name: SWG options backtest (Dhan 1-min)

on:
  workflow_dispatch:
    inputs:
      start:        {description: "Start date", default: "2023-01-01"}
      end:          {description: "End date",   default: "2026-09-30"}
      symbols:      {description: "Comma list for a quick test (blank = full universe)", default: ""}
      max_requests: {description: "Max Dhan API calls this run (daily cap 100000)", default: "60000"}
      rate:         {description: "Requests per second (Dhan data limit is 5)", default: "4"}
      slippage:     {description: "Slippage % of premium per side", default: "0.5"}
      entry_fill:   {description: "Option fill: next_open or close", default: "next_open"}

concurrency:
  group: options-backtest      # one run at a time so the cache is never written twice
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}

      - run: pip install -r requirements.txt

      # Dhan responses are cached; a stopped run resumes from here next time
      - name: Restore Dhan cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: dhan-cache-${{ github.run_id }}
          restore-keys: dhan-cache-

      - name: Run backtest
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
        run: |
          python backtest_options.py \
            --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
            --symbols "${{ inputs.symbols }}" \
            --max-requests "${{ inputs.max_requests }}" --max-minutes 300 \
            --rate "${{ inputs.rate }}" --slippage "${{ inputs.slippage }}" \
            --entry-fill "${{ inputs.entry_fill }}" \
            --cache cache --out results

      - name: Save Dhan cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: dhan-cache-${{ github.run_id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_number }}
          path: results/
          retention-days: 30
