name: GAP candle filter (retest of gap_results with a correction-candle condition)

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Pullback lookback: the close before the gap must be below (LONG) / above (SHORT) the close n days earlier"
        required: false
        default: "5"

permissions:
  contents: write

jobs:
  candle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Offline logic test
        run: python test_gap.py
      - name: Run (no Dhan login needed - reads gap_results, downloads Yahoo daily candles)
        run: python gap_candle_filter.py "${{ inputs.n }}"
      - name: Show the summary
        if: always()
        run: |
          if [ -f gap_candle_results/COMPARE.md ]; then cat gap_candle_results/COMPARE.md >> "$GITHUB_STEP_SUMMARY"; fi
          for v in red pullback; do if [ -f gap_candle_results/$v/survivors/SURVIVORS.md ]; then cat gap_candle_results/$v/survivors/SURVIVORS.md >> "$GITHUB_STEP_SUMMARY"; fi; done
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "gap-bot"
          git config user.email "gap-bot@users.noreply.github.com"
          git add gap_candle_results || true
          git commit -m "GAP candle filter results" || echo "nothing new to commit"
          git pull --no-rebase -X ours --no-edit || true
          git push || true
