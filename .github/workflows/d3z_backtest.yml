name: D3Z two-year backtest (Yahoo + Dhan)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = test Dhan access (run first) | run = full backtest (run again to continue) | summary = rebuild tables | range = tables and trades for chosen dates'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - run
          - summary
          - range
      start:
        description: 'Start entry date (empty = 2024-10-01). Used by run and range'
        required: false
        default: ''
      end:
        description: 'Stop entry date, included (empty = 2026-09-30). Used by run and range'
        required: false
        default: ''
      entry_type:
        description: 'range mode: ALL, OPEN_0915, FROM_0920_4C or RECROSS_0920_4C (empty = no trade list)'
        required: false
        default: ''
      exit_rule:
        description: 'range mode: 09:30, 10:00, 12:00 or 15:30 (empty = all)'
        required: false
        default: ''
      sl:
        description: 'range mode: stop loss 10 or 20 (empty = all)'
        required: false
        default: ''
      tp:
        description: 'range mode: target 20, 30, 40, 60, 80, 100, 120, 140 or 200 (empty = all)'
        required: false
        default: ''
      min_trades:
        description: 'Minimum trades for a setup to appear in rankings'
        required: false
        default: '30'
      offsets:
        description: 'Option strikes fetched: 0 = ATM only (fastest) | 0,1,-1 = ATM and neighbours (default)'
        required: false
        default: '0,1,-1'
      budget_minutes:
        description: 'run mode: stop politely after this many minutes (progress is saved)'
        required: false
        default: '300'

permissions:
  contents: write

concurrency:
  group: d3z-dhan-queue
  cancel-in-progress: false

jobs:
  d3z:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests yfinance pandas numpy

      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          BUDGET_MIN: ${{ github.event.inputs.budget_minutes }}
          D3Z_START: ${{ github.event.inputs.start }}
          D3Z_END: ${{ github.event.inputs.end }}
          OFFSETS: ${{ github.event.inputs.offsets }}
          ENTRY_TYPE: ${{ github.event.inputs.entry_type }}
          EXIT_RULE: ${{ github.event.inputs.exit_rule }}
          SL: ${{ github.event.inputs.sl }}
          TP: ${{ github.event.inputs.tp }}
          MIN_TRADES: ${{ github.event.inputs.min_trades }}
        run: python -u d3z_backtest.py ${{ github.event.inputs.mode }}

      - name: Save results
        if: always()
        run: |
          git config user.name "d3z-bot"
          git config user.email "d3z-bot@users.noreply.github.com"
          for d in d3z_results d3z_range_out; do if [ -d $d ]; then git add $d; fi; done
          git diff --cached --quiet || git commit -m "d3z results"
          git pull --no-rebase -X ours --no-edit || true
          git push || true
