name: Decompress CSV.GZ

on:
  push:
    branches: [ main ] # Runs when you push to the main branch

jobs:
  decompress:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This grants write access to push changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decompress the file
        run: |
          # Finds all .csv.gz files and decompresses them into .csv
          gzip -d -k *.csv.gz || true 

      - name: Commit and Push the CSV file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.csv
          git commit -m "Automated conversion of csv.gz to csv" || exit 0
          git push
          
