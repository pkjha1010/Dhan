name: GAP volume filter (retest of gap_results, gap candle volume vs average of previous candles)

on:
  workflow_dispatch:
    inputs:
      mult:
        description: "Gap candle (daily) volume must be >= this x the average volume of the previous n daily candles (0 = filter off)"
        required: false
        default: "2"
      n:
        description: "How many previous daily candles are averaged"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  vol:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Offline logic test
        run: python test_gap.py
      - name: Run (no Dhan login needed - reads gap_results, downloads Yahoo daily volumes)
        run: python gap_volume_filter.py "${{ inputs.mult }}" "${{ inputs.n }}"
      - name: Show the summary
        if: always()
        run: |
          if [ -f gap_vol_results/COMPARE.md ]; then cat gap_vol_results/COMPARE.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f gap_vol_results/survivors/SURVIVORS.md ]; then cat gap_vol_results/survivors/SURVIVORS.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "gap-bot"
          git config user.email "gap-bot@users.noreply.github.com"
          git add gap_vol_results || true
          git commit -m "GAP volume filter results" || echo "nothing new to commit"
          git pull --no-rebase -X ours --no-edit || true
          git push || true
