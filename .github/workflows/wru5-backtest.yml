name: WRU-5 backtest (rolling low 1H/4H, resistance/support lines, 5-day high/low, pivots - SHORT entries 09:15-09:30, all F&O stocks, Dhan)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test Dhan access | run = full backtest (resumable - run again until PROGRESS says COMPLETE) | summary = rebuild result files from saved data (no API calls)"
        type: choice
        options: [check, run, summary]
        default: run
      start:
        description: "Start date YYYY-MM-DD (entry dates)"
        required: false
        default: "2023-01-01"
      end:
        description: "End date YYYY-MM-DD (entry dates)"
        required: false
        default: "2026-10-31"
      symbols:
        description: "Stocks (space or comma separated). Blank = all F&O stocks"
        required: false
        default: ""
      sls:
        description: "Stop-loss % list (0 = no stop-loss)"
        required: false
        default: "10,20,30,0"
      tps:
        description: "Target % list (0 = no target)"
        required: false
        default: "10,20,30,40,60,0"

permissions:
  contents: write

concurrency:
  group: wru5-backtest
  cancel-in-progress: false

jobs:
  wru5:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Offline logic test
        run: python test_wru5.py

      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          A8_OUT: wru5_results
          A8_START: ${{ inputs.start }}
          A8_END: ${{ inputs.end }}
          A8_SYMBOLS: ${{ inputs.symbols }}
          A8_SLS: ${{ inputs.sls }}
          A8_TPS: ${{ inputs.tps }}
          A8_ENTRY_LAST: "09:30"
          A8_TRADES_ALL: "1"
          BUDGET_MIN: "320"
        run: python wru5_backtest.py "${{ inputs.mode }}"

      - name: Save results to the repo
        if: always() && inputs.mode != 'check'
        run: |
          git config user.name "wru5-bot"
          git config user.email "wru5-bot@users.noreply.github.com"
          git add wru5_results || true
          git commit -m "wru5 results" || echo "nothing new to commit"
          git pull --no-rebase -X ours --no-edit || true
          git push || true

      - name: Upload results
        if: always() && inputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: wru5-results-${{ github.run_number }}
          path: wru5_results/
          if-no-files-found: ignore
