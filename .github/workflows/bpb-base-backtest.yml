name: BPB BASE backtest (10-day breakout + pullback, entry at the highest price, LONG call + SHORT put, full-day entry, NIFTY50 filter, SL x TP x time exit, all F&O stocks, 3 years, Dhan)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test Dhan access + print the rules | run = full backtest (resumable - run again until PROGRESS.txt says COMPLETE) | summary = rebuild result files from saved data (no API calls) | report = NIFTY50 filter (before / after) + top-10% trimmed survivors (no API calls)"
        type: choice
        options: [check, run, summary, report]
        default: run
      start:
        description: "Start date YYYY-MM-DD (entry dates)"
        required: false
        default: "2023-10-30"
      end:
        description: "End date YYYY-MM-DD (entry dates)"
        required: false
        default: "2026-10-30"
      symbols:
        description: "Stocks (space or comma separated). Blank = all F&O stocks (use a few for a quick test, e.g. RELIANCE,SBIN,INFY)"
        required: false
        default: ""
      sls:
        description: "Stop-loss % of premium list (0 = no stop-loss)"
        required: false
        default: "0,20,40,60"
      tps:
        description: "Target % of premium list (0 = no target)"
        required: false
        default: "60,80,100,120,0"
      exits:
        description: "Time exits, comma separated (same day)"
        required: false
        default: "15:00,15:30"
      itm_max:
        description: "Strike rule: ATM first, then ITM-1, ITM-2 ... up to ITM-n until a strike has a candle (0 = ATM only)"
        required: false
        default: "3"
      out_dir:
        description: "Result folder (blank = bpb_base_results). Use another name if you change any setting - the saved data belongs to one setting"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: bpb-base-backtest
  cancel-in-progress: false

jobs:
  bpb:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Offline logic test
        run: python test_bpb_base.py && python test_gap_nifty.py && python test_itm_fallback.py
      - name: Run
        if: inputs.mode != 'report'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          BB_START: ${{ inputs.start }}
          BB_END: ${{ inputs.end }}
          BB_SYMBOLS: ${{ inputs.symbols }}
          BB_SLS: ${{ inputs.sls }}
          BB_TPS: ${{ inputs.tps }}
          BB_EXITS: ${{ inputs.exits }}
          BB_ITM_MAX: ${{ inputs.itm_max }}
          BB_OUT: ${{ inputs.out_dir }}
        run: python bpb_base_backtest.py "${{ inputs.mode }}"
      - name: NIFTY50 filter + top-10% trimmed survivors (no API calls)
        if: always() && (inputs.mode == 'report' || inputs.mode == 'summary' || inputs.mode == 'run')
        env:
          BR_SRC: ${{ inputs.out_dir }}
        run: python bpb_base_report.py || true
      - name: Show the summary
        if: always()
        run: |
          for f in bpb_base_results/SUMMARY.md bpb_base_nifty_results/COMPARE.md bpb_base_nifty_results/TRIM10.md; do if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi; done
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "bpb-bot"
          git config user.email "bpb-bot@users.noreply.github.com"
          git add bpb_base_results bpb_base_nifty_results || true
          git commit -m "BPB BASE backtest results" || echo "nothing new to commit"
          git pull --no-rebase -X ours --no-edit || true
          git push || true
