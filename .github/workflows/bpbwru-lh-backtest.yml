name: BPB-WRU LH backtest (BPB short + WRU short, previous-day last half hour / 13:00-15:00 filter, entry 09:15-10:00, ATM then ITM-1/ITM-2, Dhan)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test Dhan access | run = full backtest (resumable - run again until PROGRESS says COMPLETE) | summary = rebuild result files from saved data (no API calls)"
        type: choice
        options: [check, run, summary]
        default: run
      start:
        description: "Start date YYYY-MM-DD (entry dates)"
        required: false
        default: "2023-01-01"
      end:
        description: "End date YYYY-MM-DD (entry dates)"
        required: false
        default: "2026-10-31"
      symbols:
        description: "Stocks (space or comma separated). Blank = all F&O stocks"
        required: false
        default: ""
      bases:
        description: "Strategies: BPB,WRU (any subset)"
        required: false
        default: "BPB,WRU"
      variants:
        description: "Afternoon variants: LHU_MU,LHU_MD,LHD_MU,LHD_MD (H = last half hour, M = 13:00-15:00, U = bullish, D = bearish) - any subset"
        required: false
        default: "LHU_MU,LHU_MD,LHD_MU,LHD_MD"
      baseline:
        description: "1 = also run every strategy with NO afternoon filter (ALL) for comparison, 0 = filtered only"
        required: false
        default: "1"
      exits:
        description: "Time exits (HH:MM list)"
        required: false
        default: "09:20,09:30,10:00"
      sls:
        description: "Stop-loss % list (0 = no stop-loss)"
        required: false
        default: "0,10,20,40,60"
      tps:
        description: "Target % list (0 = no target)"
        required: false
        default: "20,40,60,80,120,0"

permissions:
  contents: write

concurrency:
  group: bpbwru-lh-backtest
  cancel-in-progress: false

jobs:
  bpbwru_lh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Offline logic tests
        run: |
          python test_shapetrend.py
          python test_bpbwru_lh.py

      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          A8_OUT: bpbwru_lh_results
          A8_START: ${{ inputs.start }}
          A8_END: ${{ inputs.end }}
          A8_SYMBOLS: ${{ inputs.symbols }}
          A8_SLS: ${{ inputs.sls }}
          A8_TPS: ${{ inputs.tps }}
          A8_ENTRY_LAST: "10:00"
          A8_TRADES_ALL: "1"
          LH_BASES: ${{ inputs.bases }}
          LH_VARIANTS: ${{ inputs.variants }}
          LH_BASELINE: ${{ inputs.baseline }}
          LH_EXITS: ${{ inputs.exits }}
          BUDGET_MIN: "320"
        run: python bpbwru_lh_backtest.py "${{ inputs.mode }}"

      - name: Save results to the repo
        if: always() && inputs.mode != 'check'
        run: |
          git config user.name "bpbwru-lh-bot"
          git config user.email "bpbwru-lh-bot@users.noreply.github.com"
          git add bpbwru_lh_results || true
          git commit -m "bpbwru lh results" || echo "nothing new to commit"
          git pull --no-rebase -X ours --no-edit || true
          git push || true

      - name: Upload results
        if: always() && inputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: bpbwru-lh-results-${{ github.run_number }}
          path: bpbwru_lh_results/
          if-no-files-found: ignore
