name: Decompress ALL-8 CSV.gz files

on:
  workflow_dispatch:
  push:
    paths:
      - "all8_results/all_trades/*.csv.gz"
      - "all8_results/all_trades_top_variants.csv.gz"

permissions:
  contents: write

concurrency:
  group: decompress-all8
  cancel-in-progress: false

jobs:
  decompress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decompress to plain CSV (all8_results/csv/)
        run: |
          mkdir -p all8_results/csv
          for f in all8_results/all_trades/*.csv.gz all8_results/all_trades_top_variants.csv.gz; do
            [ -f "$f" ] || continue
            gunzip -c "$f" > "all8_results/csv/$(basename "${f%.gz}")"
          done
          ls -la all8_results/csv

      - name: Save CSV files to the repo
        run: |
          git config user.name "all8-bot"
          git config user.email "all8-bot@users.noreply.github.com"
          git add all8_results/csv
          git commit -m "all8: decompressed CSV files" || echo "nothing new to commit"
          git pull --rebase --autostash || true
          git push || true

      - uses: actions/upload-artifact@v4
        with:
          name: all8-csv-${{ github.run_number }}
          path: all8_results/csv/
