name: BPB BB backtest (your pure-breakout + Bollinger script, B+n entry days, LONG call + SHORT put, 1-minute entry, SL x TP x time exit, all F&O stocks, 3 years, Dhan)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test Dhan access + print the rules | run = full backtest (resumable - run again until PROGRESS.txt says COMPLETE) | summary = rebuild result files from saved data (no API calls) | report = LONG and SHORT reports per entry rule (B+1 / B+2 / B+3 onward) and per exact B+n (no API calls)"
        type: choice
        options: [check, run, summary, report]
        default: run
      start:
        description: "Start date YYYY-MM-DD (entry dates)"
        required: false
        default: "2023-10-30"
      end:
        description: "End date YYYY-MM-DD (entry dates)"
        required: false
        default: "2026-10-30"
      symbols:
        description: "Stocks (space or comma separated). Blank = all F&O stocks (use a few for a quick test, e.g. RELIANCE,SBIN,INFY)"
        required: false
        default: ""
      sls:
        description: "Stop-loss % of premium list (0 = no stop-loss)"
        required: false
        default: "0,20,40,60"
      tps:
        description: "Target % of premium list (0 = no target)"
        required: false
        default: "40,60,80,120,0"
      exits:
        description: "Time exits, comma separated (same day)"
        required: false
        default: "09:30,10:00,12:00,15:00,15:30"
      lookback:
        description: "Breakout window in days (your script: 5). B = the breakout day, entries are labelled B+n"
        required: false
        default: "5"
      bb_only:
        description: "1 = fetch only entries that pass the previous-day Bollinger filter (your strategy). 0 = fetch the others too (about 3x the Dhan calls) for a with / without comparison"
        required: false
        default: "1"
      skip_gap:
        description: "1 = remove entries whose 09:15 candle OPENS beyond the entry level (gap-up for LONG, gap-down for SHORT). 0 = keep them"
        required: false
        default: "1"
      itm_max:
        description: "Strike rule: ATM first, then ITM-1, ITM-2 ... up to ITM-n until a strike has a candle (0 = ATM only)"
        required: false
        default: "3"
      out_dir:
        description: "Result folder (blank = bpb_bb_results). Use another name if you change any setting - the saved data belongs to one setting"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: bpb-bb-backtest
  cancel-in-progress: false

jobs:
  bpbbb:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Offline logic test
        run: python test_bpb_bb.py && python test_bpb_bb_pipeline.py && python test_itm_fallback.py
      - name: Run
        if: inputs.mode != 'report'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          BBB_START: ${{ inputs.start }}
          BBB_END: ${{ inputs.end }}
          BBB_SYMBOLS: ${{ inputs.symbols }}
          BBB_SLS: ${{ inputs.sls }}
          BBB_TPS: ${{ inputs.tps }}
          BBB_EXITS: ${{ inputs.exits }}
          BBB_ITM_MAX: ${{ inputs.itm_max }}
          BBB_LOOKBACK: ${{ inputs.lookback }}
          BBB_BB_ONLY: ${{ inputs.bb_only }}
          BBB_SKIP_GAP: ${{ inputs.skip_gap }}
          BBB_OUT: ${{ inputs.out_dir }}
        run: python bpb_bb_backtest.py "${{ inputs.mode }}"
      - name: Bollinger-filter comparison (no API calls)
        if: always() && (inputs.mode == 'report' || inputs.mode == 'summary' || inputs.mode == 'run')
        env:
          BBR_SRC: ${{ inputs.out_dir }}
          BBR_OUT: ${{ inputs.out_dir != '' && format('{0}_report', inputs.out_dir) || '' }}
        run: python bpb_bb_report.py || true
      - name: Show the summary
        if: always()
        env:
          OUT_DIR: ${{ inputs.out_dir }}
        run: |
          R="${OUT_DIR:-bpb_bb_results}"; P="${OUT_DIR:+${OUT_DIR}_report}"; P="${P:-bpb_bb_report}"
          for f in "$R/SUMMARY.md" "$P/long/COMPARE.md" "$P/short/COMPARE.md"; do if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi; done
      - name: Save results to the repo
        if: always()
        env:
          OUT_DIR: ${{ inputs.out_dir }}
        run: |
          git config user.name "bpb-bot"
          git config user.email "bpb-bot@users.noreply.github.com"
          git add bpb_bb_results bpb_bb_report || true
          if [ -n "$OUT_DIR" ]; then git add "$OUT_DIR" "${OUT_DIR}_report" || true; fi
          git commit -m "BPB BB backtest results" || echo "nothing new to commit"
          git pull --no-rebase -X ours --no-edit || true
          git push || true
