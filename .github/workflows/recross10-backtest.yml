name: RECROSS-10 backtest (BPB + 4 shape patterns, long and short, confirmed 1-min re-cross entry, all F&O stocks, Dhan)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test Dhan access + rule | run = full backtest (resumable - run again until PROGRESS.txt says COMPLETE) | summary = rebuild result files from saved data (no API calls)"
        type: choice
        options: [check, run, summary]
        default: run
      start:
        description: "Start date YYYY-MM-DD (entry dates)"
        required: false
        default: "2023-01-01"
      end:
        description: "End date YYYY-MM-DD (entry dates)"
        required: false
        default: "2026-08-31"
      symbols:
        description: "Stocks (space or comma separated). Blank = all F&O stocks (use a few for a quick test)"
        required: false
        default: ""
      sls:
        description: "Stop-loss % list (0 = no stop-loss)"
        required: false
        default: "0,20,40,60"
      tps:
        description: "Target % list (0 = no target)"
        required: false
        default: "0,20,40,60,80"
      band_pct:
        description: "Re-cross band in percent of the level: a close counts as beyond / back only when it is this far past the level (fake-breakout filter)"
        required: false
        default: "0.05"
      base:
        description: "Closes on the far side of the level before the first break"
        required: false
        default: "4"
      hold:
        description: "Consecutive closes beyond the level that confirm the re-cross (entry = the last one)"
        required: false
        default: "2"
      entry_last:
        description: "Last minute an entry is accepted"
        required: false
        default: "15:20"
      min_trades:
        description: "Minimum trades for a variant to appear in the top / best tables"
        required: false
        default: "30"
      out_dir:
        description: "Result folder (use another name if you change band / base / hold / dates, the saved data belongs to one setting)"
        required: false
        default: "recross10_results"

permissions:
  contents: write

concurrency:
  group: recross10-backtest
  cancel-in-progress: false

jobs:
  recross10:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Offline logic test
        run: python test_recross10.py

      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          R10_START: ${{ inputs.start }}
          R10_END: ${{ inputs.end }}
          R10_SYMBOLS: ${{ inputs.symbols }}
          R10_SLS: ${{ inputs.sls }}
          R10_TPS: ${{ inputs.tps }}
          R10_BAND_PCT: ${{ inputs.band_pct }}
          R10_BASE: ${{ inputs.base }}
          R10_HOLD: ${{ inputs.hold }}
          R10_ENTRY_LAST: ${{ inputs.entry_last }}
          R10_MIN_TRADES: ${{ inputs.min_trades }}
          R10_OUT: ${{ inputs.out_dir }}
          BUDGET_MIN: "320"
        run: python recross10_backtest.py "${{ inputs.mode }}"

      - name: Show the summary
        if: always() && inputs.mode != 'check'
        run: |
          if [ -f "${{ inputs.out_dir || 'recross10_results' }}/SUMMARY.md" ]; then cat "${{ inputs.out_dir || 'recross10_results' }}/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save results to the repo
        if: always() && inputs.mode != 'check'
        run: |
          git config user.name "recross10-bot"
          git config user.email "recross10-bot@users.noreply.github.com"
          git add "${{ inputs.out_dir || 'recross10_results' }}" || true
          git commit -m "recross10 results" || echo "nothing new to commit"
          git pull --no-rebase -X ours --no-edit || true
          git push || true

      - name: Upload results
        if: always() && inputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: recross10-results-${{ github.run_number }}
          path: ${{ inputs.out_dir || 'recross10_results' }}/
          if-no-files-found: ignore
