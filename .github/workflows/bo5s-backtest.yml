name: "BO5S backtest - SHORT mirror (10-day-low breakdown + lower Bollinger + prev day red + longer lower wick, ATM put, entry at the close, next-morning exit grid, all F&O stocks, 2026, Dhan)"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test Dhan access + print the rules | run = full backtest (resumable - run again until PROGRESS.txt says COMPLETE) | summary = rebuild result files from saved data with a new exit grid / capital (no API calls)"
        type: choice
        options: [check, run, summary]
        default: run
      start:
        description: "Start date YYYY-MM-DD (breakdown / entry dates)"
        required: false
        default: "2026-01-01"
      end:
        description: "End date YYYY-MM-DD (breakdown / entry dates; the next trading day must exist). Blank = today"
        required: false
        default: ""
      symbols:
        description: "Stocks (space or comma separated). Blank = all F&O stocks (use a few for a quick test, e.g. RELIANCE,SBIN,INFY)"
        required: false
        default: ""
      exits:
        description: "Time exits on the next day: 0915o = 09:15 open, 0915c / 0916c / 0920c / 0930c = close of that minute (max 10:00)"
        required: false
        default: "0915o,0915c,0916c,0920c,0930c"
      sls:
        description: "Percent stop-loss list (0 = none)"
        required: false
        default: "0,20,40,60"
      gaps:
        description: "Gap rule (stock opens ABOVE the entry price -> sell the put at the 09:15 option open): 0 = off, 1 = on. '0,1' tests both"
        required: false
        default: "0,1"
      tps:
        description: "Target % of premium list (0 = no target)"
        required: false
        default: "40,60,80,100,120,200,0"
      cap:
        description: "Capital per trade in Rs"
        required: false
        default: "60000"
      itm_max:
        description: "Strike rule at entry: ATM first, then ITM-1, ITM-2 ... up to ITM-n if the ATM series has no candle near the close (0 = ATM only)"
        required: false
        default: "3"
      out_dir:
        description: "Result folder (blank = bo5s_results). Use another name if you change start / end / symbols / itm_max - the saved candles belong to one setting"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: bo5s-backtest
  cancel-in-progress: false

jobs:
  bo5s:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Offline logic test
        run: python test_bo5s.py && python test_bo5w.py
      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          BO5S_START: ${{ inputs.start }}
          BO5S_END: ${{ inputs.end }}
          BO5S_SYMBOLS: ${{ inputs.symbols }}
          BO5S_EXITS: ${{ inputs.exits }}
          BO5S_SLS: ${{ inputs.sls }}
          BO5S_GAPS: ${{ inputs.gaps }}
          BO5S_TPS: ${{ inputs.tps }}
          BO5S_CAP: ${{ inputs.cap }}
          BO5S_ITM_MAX: ${{ inputs.itm_max }}
          BO5S_OUT: ${{ inputs.out_dir }}
        run: python bo5s_backtest.py "${{ inputs.mode }}"
      - name: Show the summary
        if: always()
        env:
          OUT_DIR: ${{ inputs.out_dir }}
        run: |
          R="${OUT_DIR:-bo5s_results}"
          if [ -f "$R/SUMMARY.md" ]; then cat "$R/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save results to the repo
        if: always()
        env:
          OUT_DIR: ${{ inputs.out_dir }}
        run: |
          git config user.name "bo5s-bot"
          git config user.email "bo5s-bot@users.noreply.github.com"
          git add bo5s_results || true
          if [ -n "$OUT_DIR" ]; then git add "$OUT_DIR" || true; fi
          git commit -m "BO5S backtest results" || echo "nothing new to commit"
          git pull --no-rebase -X ours --no-edit || true
          git push || true
