name: REL backtest - shape rule, all F&O, exit 5 and 10 min after entry, SL 10% (Yahoo + Dhan)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = test Dhan access (run first) | run = backtest (run again to continue) | summary = rebuild tables'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - run
          - summary
      start:
        description: 'First entry date (empty = 2026-01-01)'
        required: false
        default: ''
      end:
        description: 'Last entry date, included (empty = 2026-09-30)'
        required: false
        default: ''
      neighbour_strikes:
        description: 'Extra strikes tried only when ATM data is missing: 1,-1 (default) | empty = ATM only'
        required: false
        default: '1,-1'
      capital:
        description: 'Rupees per trade (empty = 200000)'
        required: false
        default: ''
      calls_per_second_gap:
        description: 'Seconds between call starts. 0.205 = about 4.9 calls/second (Dhan limit is 5). Raise to 0.3 if rate-limit messages appear'
        required: false
        default: '0.205'
      parallel_calls:
        description: 'Calls in flight at once (more = faster when Dhan replies slowly)'
        required: false
        default: '12'
      budget_minutes:
        description: 'run mode: stop politely after this many minutes (progress is saved)'
        required: false
        default: '300'

permissions:
  contents: write

concurrency:
  group: rel-dhan-queue
  cancel-in-progress: false

jobs:
  rel:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests yfinance pandas numpy

      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          BUDGET_MIN: ${{ github.event.inputs.budget_minutes }}
          SHAPECMP_START: ${{ github.event.inputs.start }}
          SHAPECMP_END: ${{ github.event.inputs.end }}
          OFFSETS2: ${{ github.event.inputs.neighbour_strikes }}
          DHAN_GAP: ${{ github.event.inputs.calls_per_second_gap }}
          DHAN_CONC: ${{ github.event.inputs.parallel_calls }}
          CAPITAL: ${{ github.event.inputs.capital }}
        run: python -u rel_backtest.py ${{ github.event.inputs.mode }}

      - name: Download results (zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rel-results
          path: |
            rel_results/all_trades_combined
            rel_results/variants_combined.csv
            rel_results/by_month.csv
            rel_results/by_stock.csv
            rel_results/by_direction.csv
            rel_results/by_entry_hour.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Save results
        if: always()
        run: |
          git config user.name "rel-bot"
          git config user.email "rel-bot@users.noreply.github.com"
          for d in rel_results; do if [ -d $d ]; then git add $d; fi; done
          git diff --cached --quiet || git commit -m "rel results"
          git pull --no-rebase -X ours --no-edit || true
          git push || true
