name: GAP backtest (gap-fade reversal, LONG call + SHORT put, SL x TP x time-exit grid, all F&O stocks, 3 years, Dhan)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test Dhan access + print the rules | run = full backtest (resumable - run again until PROGRESS.txt says COMPLETE) | summary = rebuild result files from saved data (no API calls)"
        type: choice
        options: [check, run, summary]
        default: run
      start:
        description: "Start date YYYY-MM-DD (entry dates)"
        required: false
        default: "2023-10-30"
      end:
        description: "End date YYYY-MM-DD (entry dates)"
        required: false
        default: "2026-10-30"
      symbols:
        description: "Stocks (space or comma separated). Blank = all F&O stocks (use a few for a quick test, e.g. RELIANCE,SBIN,INFY)"
        required: false
        default: ""
      sls:
        description: "Stop-loss % of premium list (0 = no stop-loss)"
        required: false
        default: "0,20,40,60"
      tps:
        description: "Target % of premium list (0 = no target)"
        required: false
        default: "20,40,60,80,120,0"
      exits:
        description: "Time exits, comma separated (same day)"
        required: false
        default: "09:30,10:00,12:00,15:30"
      gap:
        description: "Minimum gap of the signal day vs the previous close, in % (original script: 1)"
        required: false
        default: "1"
      first:
        description: "First entry day = signal day + this many trading days (original: 2)"
        required: false
        default: "2"
      last:
        description: "Last entry day = signal day + this many trading days (original: 4)"
        required: false
        default: "4"
      itm_max:
        description: "Strike rule: ATM first, then ITM-1, ITM-2 ... up to ITM-n until a strike has a candle (0 = ATM only)"
        required: false
        default: "3"
      entry_last:
        description: "Last minute an entry is accepted"
        required: false
        default: "15:20"
      min_trades:
        description: "Minimum trades for a variant to appear in the top / best tables"
        required: false
        default: "30"
      expiry_next:
        description: "1 = on the monthly expiry day use the next month's options (0 = always the nearest month)"
        required: false
        default: "1"
      out_dir:
        description: "Result folder (blank = gap_results). Use another name if you change any setting - the saved data belongs to one setting"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: gap-backtest
  cancel-in-progress: false

jobs:
  gap:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Offline logic test
        run: python test_gap.py && python test_itm_fallback.py

      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          GP_START: ${{ inputs.start }}
          GP_END: ${{ inputs.end }}
          GP_SYMBOLS: ${{ inputs.symbols }}
          GP_SLS: ${{ inputs.sls }}
          GP_TPS: ${{ inputs.tps }}
          GP_EXITS: ${{ inputs.exits }}
          GP_GAP: ${{ inputs.gap }}
          GP_FIRST: ${{ inputs.first }}
          GP_LAST: ${{ inputs.last }}
          GP_ITM_MAX: ${{ inputs.itm_max }}
          GP_ENTRY_LAST: ${{ inputs.entry_last }}
          GP_MIN_TRADES: ${{ inputs.min_trades }}
          GP_EXPIRY_NEXT: ${{ inputs.expiry_next }}
          GP_OUT: ${{ inputs.out_dir }}
          BUDGET_MIN: "320"
        run: python gap_backtest.py "${{ inputs.mode }}"

      - name: Show the summary
        if: always() && inputs.mode != 'check'
        run: |
          OUT="${{ inputs.out_dir || 'gap_results' }}"
          if [ -f "$OUT/SUMMARY.md" ]; then cat "$OUT/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save results to the repo
        if: always() && inputs.mode != 'check'
        run: |
          OUT="${{ inputs.out_dir || 'gap_results' }}"
          git config user.name "gap-bot"
          git config user.email "gap-bot@users.noreply.github.com"
          git add "$OUT" || true
          git commit -m "gap results" || echo "nothing new to commit"
          git pull --no-rebase -X ours --no-edit || true
          git push || true

      - name: Upload results
        if: always() && inputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: gap-results-${{ github.run_number }}
          path: ${{ inputs.out_dir || 'gap_results' }}/
          if-no-files-found: ignore
