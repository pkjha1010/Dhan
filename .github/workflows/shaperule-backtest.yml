name: SHAPE-RULE backtest (4 daily patterns, all F&O stocks, Dhan 1-min)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test Dhan access | run = full backtest (resumable) | summary = rebuild tables from saved data (no API calls)"
        type: choice
        options: [check, run, summary]
        default: run
      start:
        description: "Start date YYYY-MM-DD (entry dates)"
        required: true
      end:
        description: "End date YYYY-MM-DD (entry dates)"
        required: true
      symbols:
        description: "Stocks (space or comma separated). Blank = all F&O stocks"
        required: false
        default: ""
      sls:
        description: "Trade stop-loss % list"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: shaperule-backtest
  cancel-in-progress: false

jobs:
  shaperule:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Offline logic test
        run: python test_shaperule.py

      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          SR_START: ${{ inputs.start }}
          SR_END: ${{ inputs.end }}
          SR_SYMBOLS: ${{ inputs.symbols }}
          SR_SLS: ${{ inputs.sls }}
          BUDGET_MIN: "320"
        run: python shaperule_backtest.py "${{ inputs.mode }}"

      - name: Save results to the repo
        if: always() && inputs.mode != 'check'
        run: |
          git config user.name "combo-bot"
          git config user.email "combo-bot@users.noreply.github.com"
          git add shaperule_results || true
          git commit -m "shaperule results" || echo "nothing new to commit"
          git pull --no-rebase -X ours --no-edit || true
          git push || true

      - name: Upload results
        if: always() && inputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: shaperule-results-${{ github.run_number }}
          path: shaperule_results/
          if-no-files-found: ignore
