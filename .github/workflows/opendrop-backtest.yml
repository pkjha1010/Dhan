name: OPENDROP backtest (open-drop retest, LONG call, SL x TP x time-exit grid, all F&O stocks, 1 year, Dhan)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test Dhan access + print the rules | run = full backtest (resumable - run again until PROGRESS.txt says COMPLETE) | summary = rebuild result files from saved data (no API calls)"
        type: choice
        options: [check, run, summary]
        default: run
      start:
        description: "Start date YYYY-MM-DD (entry dates)"
        required: false
        default: "2025-11-12"
      end:
        description: "End date YYYY-MM-DD (entry dates)"
        required: false
        default: "2026-11-12"
      symbols:
        description: "Stocks (space or comma separated). Blank = all F&O stocks (use a few for a quick test, e.g. RELIANCE,SBIN,INFY)"
        required: false
        default: ""
      sls:
        description: "Stop-loss % of premium list (0 = no stop-loss)"
        required: false
        default: "0,20,40,60"
      tps:
        description: "Target % of premium list (0 = no target)"
        required: false
        default: "40,60,80,120,0"
      exits:
        description: "Time exits, comma separated (same day)"
        required: false
        default: "09:30,10:00,12:00,15:00,15:30"
      min_slope:
        description: "NIFTY50 hourly slope filter on the setup day (original: -0.5; 'off' = no filter)"
        required: false
        default: "-0.5"
      itm_max:
        description: "Strike rule: ATM first, then ITM-1, ITM-2 ... up to ITM-n until a strike has a candle (0 = ATM only)"
        required: false
        default: "3"
      entry_last:
        description: "Last minute an entry is accepted"
        required: false
        default: "15:20"
      min_trades:
        description: "Minimum trades for a variant to appear in the top / best tables"
        required: false
        default: "30"
      expiry_next:
        description: "1 = on the monthly expiry day use the next month's options (0 = always the nearest month)"
        required: false
        default: "1"
      out_dir:
        description: "Result folder (blank = opendrop_results). Use another name if you change any setting - the saved data belongs to one setting"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: opendrop-backtest
  cancel-in-progress: false

jobs:
  opendrop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Offline logic test
        run: python test_opendrop.py && python test_itm_fallback.py

      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          OD_START: ${{ inputs.start }}
          OD_END: ${{ inputs.end }}
          OD_SYMBOLS: ${{ inputs.symbols }}
          OD_SLS: ${{ inputs.sls }}
          OD_TPS: ${{ inputs.tps }}
          OD_EXITS: ${{ inputs.exits }}
          OD_MIN_SLOPE: ${{ inputs.min_slope }}
          OD_ITM_MAX: ${{ inputs.itm_max }}
          OD_ENTRY_LAST: ${{ inputs.entry_last }}
          OD_MIN_TRADES: ${{ inputs.min_trades }}
          OD_EXPIRY_NEXT: ${{ inputs.expiry_next }}
          OD_OUT: ${{ inputs.out_dir }}
          BUDGET_MIN: "320"
        run: python opendrop_backtest.py "${{ inputs.mode }}"

      - name: Show the summary
        if: always() && inputs.mode != 'check'
        run: |
          OUT="${{ inputs.out_dir || 'opendrop_results' }}"
          if [ -f "$OUT/SUMMARY.md" ]; then cat "$OUT/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save results to the repo
        if: always() && inputs.mode != 'check'
        run: |
          OUT="${{ inputs.out_dir || 'opendrop_results' }}"
          git config user.name "opendrop-bot"
          git config user.email "opendrop-bot@users.noreply.github.com"
          git add "$OUT" || true
          git commit -m "opendrop results" || echo "nothing new to commit"
          git pull --no-rebase -X ours --no-edit || true
          git push || true

      - name: Upload results
        if: always() && inputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: opendrop-results-${{ github.run_number }}
          path: ${{ inputs.out_dir || 'opendrop_results' }}/
          if-no-files-found: ignore
