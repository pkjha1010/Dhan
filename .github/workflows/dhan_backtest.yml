name: 8 Dhan backtest 2025-2026 (ATM + ITM1)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = check Dhan API format first (about 10 calls). run = the backtest'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - run
      start:
        description: 'Start date'
        required: false
        default: '2025-01-01'
      end:
        description: 'End date'
        required: false
        default: '2026-09-30'
      stocks:
        description: 'Optional: only these stocks, comma separated (empty = all)'
        required: false
        default: ''
      max_calls:
        description: 'Max Dhan calls in this run (daily limit is 100000). Progress is saved.'
        required: false
        default: '60000'
      expiry_code:
        description: 'Leave empty. Only if calibration cannot find the near-month expiryCode'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: dhan-api
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyotp yfinance pandas numpy

      - name: Prepare cache folder
        run: mkdir -p dhan_cache dhan_backtest

      - name: Restore Dhan candle cache
        uses: actions/cache/restore@v4
        with:
          path: dhan_cache
          key: dhan-cache-restore
          restore-keys: dhan-cache-

      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          BT_START: ${{ github.event.inputs.start }}
          BT_END: ${{ github.event.inputs.end }}
          STOCKS: ${{ github.event.inputs.stocks }}
          MAX_CALLS: ${{ github.event.inputs.max_calls }}
          EXPIRY_CODE: ${{ github.event.inputs.expiry_code }}
        run: python -u algo_dhan.py ${{ github.event.inputs.mode }}

      - name: Save Dhan candle cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dhan_cache
          key: dhan-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save results
        if: always()
        run: |
          git config user.name "algo-bot"
          git config user.email "algo-bot@users.noreply.github.com"
          if [ -d dhan_backtest ]; then git add dhan_backtest; fi
          git diff --cached --quiet || (git commit -m "dhan_backtest" && git pull --rebase && git push)
