name: TPX backtest - shape rule, SL 10/20, TP 200 or none, exit 09:30/10:00, 3 entry types (Yahoo + Dhan)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = test Dhan access (run first) | run = backtest (run again to continue) | summary = rebuild tables'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - run
          - summary
      start:
        description: 'First entry date (empty = 2023-01-01)'
        required: false
        default: ''
      end:
        description: 'Last entry date, included (empty = 2023-01-31, i.e. January 2023 only)'
        required: false
        default: ''
      neighbour_strikes:
        description: 'Extra strikes tried only when ATM data is missing: 1,-1 (default) | empty = ATM only'
        required: false
        default: '1,-1'
      capital:
        description: 'Rupees per trade for SL10 (SL20 gets half; empty = 200000)'
        required: false
        default: ''
      min_trades:
        description: 'Minimum trades for a variant to appear in the ranking'
        required: false
        default: '5'
      calls_per_second_gap:
        description: 'Seconds between call starts. 0.205 = about 4.9 calls/second (Dhan limit is 5). Raise to 0.3 if rate-limit messages appear'
        required: false
        default: '0.205'
      parallel_calls:
        description: 'Calls in flight at once (more = faster when Dhan replies slowly)'
        required: false
        default: '12'
      budget_minutes:
        description: 'run mode: stop politely after this many minutes (progress is saved)'
        required: false
        default: '300'

permissions:
  contents: write

concurrency:
  group: tpx-dhan-queue
  cancel-in-progress: false

jobs:
  tpx:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests yfinance pandas numpy

      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          BUDGET_MIN: ${{ github.event.inputs.budget_minutes }}
          SHAPECMP_START: ${{ github.event.inputs.start }}
          SHAPECMP_END: ${{ github.event.inputs.end }}
          OFFSETS2: ${{ github.event.inputs.neighbour_strikes }}
          DHAN_GAP: ${{ github.event.inputs.calls_per_second_gap }}
          DHAN_CONC: ${{ github.event.inputs.parallel_calls }}
          MIN_TRADES: ${{ github.event.inputs.min_trades }}
          CAPITAL: ${{ github.event.inputs.capital }}
        run: python -u tpx_backtest.py ${{ github.event.inputs.mode }}

      - name: Download results (zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpx-results
          path: |
            tpx_results/all_trades_combined
            tpx_results/variants_combined.csv
            tpx_results/compare_tp_vs_notp.csv
            tpx_results/by_month.csv
            tpx_results/by_year.csv
            tpx_results/by_stock.csv
            tpx_results/by_direction.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Save results
        if: always()
        run: |
          git config user.name "tpx-bot"
          git config user.email "tpx-bot@users.noreply.github.com"
          for d in tpx_results; do if [ -d $d ]; then git add $d; fi; done
          git diff --cached --quiet || git commit -m "tpx results"
          git pull --no-rebase -X ours --no-edit || true
          git push || true
