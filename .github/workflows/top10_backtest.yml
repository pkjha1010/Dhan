name: TOP10 backtest - entry 09:15-09:24, SL 10%, exit 09:30 (Yahoo + Dhan)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = test Dhan access (run first) | run = backtest | summary = rebuild tables from saved results'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - run
          - summary
      stocks:
        description: 'Stocks (space or comma separated). Empty = RELIANCE HDFCBANK ICICIBANK SBIN TCS INFY AXISBANK LT ITC BHARTIARTL'
        required: false
        default: ''
      start:
        description: 'First entry date (empty = 2026-01-01)'
        required: false
        default: ''
      end:
        description: 'Last entry date, included (empty = 2026-09-30)'
        required: false
        default: ''
      capital:
        description: 'Rupees per trade (empty = 200000)'
        required: false
        default: ''
      calls_per_second_gap:
        description: 'Seconds between call starts (0.205 = about 4.9 calls/second, Dhan limit is 5)'
        required: false
        default: '0.205'
      parallel_calls:
        description: 'Calls in flight at once'
        required: false
        default: '12'

permissions:
  contents: write

concurrency:
  group: top10-dhan-queue
  cancel-in-progress: false

jobs:
  top10:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests yfinance pandas numpy

      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          TOP10: ${{ github.event.inputs.stocks }}
          SHAPECMP_START: ${{ github.event.inputs.start }}
          SHAPECMP_END: ${{ github.event.inputs.end }}
          CAPITAL: ${{ github.event.inputs.capital }}
          DHAN_GAP: ${{ github.event.inputs.calls_per_second_gap }}
          DHAN_CONC: ${{ github.event.inputs.parallel_calls }}
          MIN_TRADES: '5'
          BUDGET_MIN: '50'
        run: python -u top10_backtest.py ${{ github.event.inputs.mode }}

      - name: Download results (zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top10-results
          path: |
            top10_results/all_trades_combined
            top10_results/compare_shape_vs_noshape.csv
            top10_results/variants_combined.csv
            top10_results/by_month.csv
            top10_results/by_stock.csv
            top10_results/by_direction.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Save results
        if: always()
        run: |
          git config user.name "top10-bot"
          git config user.email "top10-bot@users.noreply.github.com"
          if [ -d top10_results ]; then git add top10_results; fi
          git diff --cached --quiet || git commit -m "top10 results"
          git pull --no-rebase -X ours --no-edit || true
          git push || true
