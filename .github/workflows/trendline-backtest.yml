name: TRENDLINE break-retest backtest (all F&O stocks, Dhan 1-min)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test Dhan access | run = full backtest (resumable) | summary = rebuild tables from saved data (no API calls)"
        type: choice
        options: [check, run, summary]
        default: run
      start:
        description: "Start date YYYY-MM-DD (entry dates)"
        required: true
      end:
        description: "End date YYYY-MM-DD (entry dates)"
        required: true
      symbols:
        description: "Stocks (space or comma separated). Blank = all F&O stocks"
        required: false
        default: ""
      sls:
        description: "Trade stop-loss % list"
        required: false
        default: "10"
      day_sls:
        description: "Day stop-loss list in Rs (0 = no day stop-loss)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: trendline-backtest
  cancel-in-progress: false

jobs:
  trendline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Offline logic test
        run: python test_trendline.py

      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          TL_START: ${{ inputs.start }}
          TL_END: ${{ inputs.end }}
          TL_SYMBOLS: ${{ inputs.symbols }}
          TL_SLS: ${{ inputs.sls }}
          DAY_SLS: ${{ inputs.day_sls }}
          BUDGET_MIN: "320"
        run: python trendline_backtest.py "${{ inputs.mode }}"

      - name: Save results to the repo
        if: always() && inputs.mode != 'check'
        run: |
          git config user.name "combo-bot"
          git config user.email "combo-bot@users.noreply.github.com"
          git add trendline_results || true
          git commit -m "trendline results" || echo "nothing new to commit"
          git pull --no-rebase -X ours --no-edit || true
          git push || true

      - name: Upload results
        if: always() && inputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: trendline-results-${{ github.run_number }}
          path: trendline_results/
          if-no-files-found: ignore
