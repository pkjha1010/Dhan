name: SHAPETREND backtest (RLOW_1H_WRU, WRU_ROLL5_LOW, WRL, WRU, BPB + WGU, WGL, TL_1H, TL_4H, RC4C x 5 trend filters, all F&O stocks, Dhan)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test Dhan access | run = full backtest (resumable - run again until PROGRESS says COMPLETE) | summary = rebuild result files from saved data (no API calls)"
        type: choice
        options: [check, run, summary]
        default: run
      start:
        description: "Start date YYYY-MM-DD (entry dates)"
        required: false
        default: "2023-01-01"
      end:
        description: "End date YYYY-MM-DD (entry dates)"
        required: false
        default: "2026-10-31"
      symbols:
        description: "Stocks (space or comma separated). Blank = all F&O stocks"
        required: false
        default: ""
      bases:
        description: "Strategies: RLOW_1H_WRU,WRU_ROLL5_LOW,WRL,WRU,BPB (live plan / wru5) + WGU,WGL,TL_1H,TL_4H,RC4C (from all8, each runs LONG and SHORT) - any subset"
        required: false
        default: "RLOW_1H_WRU,WRU_ROLL5_LOW,WRL,WRU,BPB,WGU,WGL,TL_1H,TL_4H,RC4C"
      trends:
        description: "Trend filters: MA50,MA2050,ROC10,ADXDI,STRUCT (default all five - any subset)"
        required: false
        default: "MA50,MA2050,ROC10,ADXDI,STRUCT"
      baseline:
        description: "1 = also run every strategy with NO filter (NOF) for comparison, 0 = filtered only"
        required: false
        default: "1"
      exits:
        description: "Time exits: any of 09:30,10:00,12:00,15:30 and UNTIL_HIT (hold until stop / target / expiry)"
        required: false
        default: "09:30,10:00,15:30"
      sls:
        description: "Stop-loss % list (0 = no stop-loss)"
        required: false
        default: "0,10,20,30"
      tps:
        description: "Target % list (0 = no target)"
        required: false
        default: "10,20,30,40,60,400,0"

permissions:
  contents: write

concurrency:
  group: shapetrend-backtest
  cancel-in-progress: false

jobs:
  shapetrend:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Offline logic test
        run: python test_shapetrend.py

      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          A8_OUT: shapetrend_results
          A8_START: ${{ inputs.start }}
          A8_END: ${{ inputs.end }}
          A8_SYMBOLS: ${{ inputs.symbols }}
          A8_SLS: ${{ inputs.sls }}
          A8_TPS: ${{ inputs.tps }}
          A8_ENTRY_LAST: "15:20"
          A8_TRADES_ALL: "0"
          ST_BASES: ${{ inputs.bases }}
          ST_TRENDS: ${{ inputs.trends }}
          ST_BASELINE: ${{ inputs.baseline }}
          ST_EXITS: ${{ inputs.exits }}
          BUDGET_MIN: "320"
        run: python shapetrend_backtest.py "${{ inputs.mode }}"

      - name: Save results to the repo
        if: always() && inputs.mode != 'check'
        run: |
          git config user.name "shapetrend-bot"
          git config user.email "shapetrend-bot@users.noreply.github.com"
          git add shapetrend_results || true
          git commit -m "shapetrend results" || echo "nothing new to commit"
          git pull --no-rebase -X ours --no-edit || true
          git push || true

      - name: Upload results
        if: always() && inputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: shapetrend-results-${{ github.run_number }}
          path: shapetrend_results/
          if-no-files-found: ignore
