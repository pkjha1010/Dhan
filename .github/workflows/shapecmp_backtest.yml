name: SHAPECMP previous-candle shape rule vs no shape rule (Yahoo + Dhan)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = test Dhan access (run first) | run = backtest (run again to continue) | summary = rebuild tables and all-trades CSV | range = tables for chosen dates'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - run
          - summary
          - range
      start:
        description: 'First entry date (empty = 4 years back). Used by run and range'
        required: false
        default: ''
      end:
        description: 'Last entry date, included (empty = today). Used by run and range'
        required: false
        default: ''
      neighbour_strikes:
        description: 'Extra strikes tried only when ATM data is missing: 1,-1 (default) | empty = ATM only'
        required: false
        default: '1,-1'
      min_trades:
        description: 'Minimum trades for a variant to appear in the best-variants list'
        required: false
        default: '30'
      budget_minutes:
        description: 'run mode: stop politely after this many minutes (progress is saved)'
        required: false
        default: '300'

permissions:
  contents: write

concurrency:
  group: shapecmp-dhan-queue
  cancel-in-progress: false

jobs:
  shapecmp:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --prefer-binary requests yfinance pandas numpy

      - name: Run
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          BUDGET_MIN: ${{ github.event.inputs.budget_minutes }}
          SHAPECMP_START: ${{ github.event.inputs.start }}
          SHAPECMP_END: ${{ github.event.inputs.end }}
          OFFSETS2: ${{ github.event.inputs.neighbour_strikes }}
          MIN_TRADES: ${{ github.event.inputs.min_trades }}
          DHAN_GAP: '0.21'      # seconds between call starts (Dhan Data API limit 5/s -> 0.2 is the floor)
          DHAN_CONC: '16'       # calls in flight (keeps the limiter busy even when calls take 2-3 s)
          EQ_SPAN: '85'         # days of stock 1-min candles per call (Dhan max 90)
          EQ_GAP: '30'          # merge candidate days closer than this into one call
          OPT_GAP: '15'         # merge option dates closer than this into one call (max span 30)
        run: python -u shapecmp_backtest.py ${{ github.event.inputs.mode }}

      - name: Download all trades (zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shapecmp-all-trades
          path: |
            shapecmp_results/all_trades_combined
            shapecmp_results/compare_shape_vs_noshape.csv
            shapecmp_results/variants_combined.csv
            shapecmp_range_out
          if-no-files-found: ignore
          retention-days: 30

      - name: Save results
        if: always()
        run: |
          git config user.name "shapecmp-bot"
          git config user.email "shapecmp-bot@users.noreply.github.com"
          for d in shapecmp_results shapecmp_range_out; do if [ -d $d ]; then git add $d; fi; done
          git diff --cached --quiet || git commit -m "shapecmp results"
          git pull --no-rebase -X ours --no-edit || true
          git push || true
