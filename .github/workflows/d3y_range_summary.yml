name: D3Y range summary (choose dates)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (entry date), like 2025-01-01'
        required: true
        default: '2025-01-01'
      stop_date:
        description: 'Stop date (entry date, included), like 2025-12-31'
        required: true
        default: '2026-09-30'
      entry_type:
        description: 'Trades of one entry type: ALL, OPEN_0915, FROM_0920_4C, RECROSS_0920_4C (leave empty = no trade list)'
        required: false
        default: ''
      exit_rule:
        description: 'Exit time: 10:00, 12:00 or 15:30 (empty = all)'
        required: false
        default: ''
      sl:
        description: 'Stop loss %: 10 or 20 (empty = all)'
        required: false
        default: ''
      tp:
        description: 'Target %: 20, 30, 40, 60, 80, 100, 120, 140 or 200 (empty = all)'
        required: false
        default: ''
      min_trades:
        description: 'Minimum trades for a combination to appear in the rankings'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  rangesummary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pandas
        run: pip install pandas

      - name: Summary for the chosen dates
        env:
          ENTRY_TYPE: ${{ github.event.inputs.entry_type }}
          EXIT_RULE: ${{ github.event.inputs.exit_rule }}
          SL: ${{ github.event.inputs.sl }}
          TP: ${{ github.event.inputs.tp }}
        run: python -u d3y_range_summary.py "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.stop_date }}" "${{ github.event.inputs.min_trades }}"

      - name: Save results
        if: always()
        run: |
          git config user.name "d3y-bot"
          git config user.email "d3y-bot@users.noreply.github.com"
          if [ -d d3y_range_out ]; then git add d3y_range_out; fi
          git diff --cached --quiet || git commit -m "d3y range summary"
          git pull --no-rebase -X ours --no-edit || true
          git push || true
